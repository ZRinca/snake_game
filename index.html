<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="name_game">Змейка</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .game-wrapper {
            background: #ffffff;
            padding: 20px;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        canvas {
            display: block;
            margin: 0 auto;
            background: #ffffff;
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            max-width: 400px;
            touch-action: none;
            cursor: pointer;
        }
        .info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            color: #000000;
            font-size: 18px;
            font-weight: 500;
            padding: 8px 0;
            flex-wrap: wrap;
            gap: 6px;
        }
        .score {
            background: #000000;
            padding: 4px 18px;
            border-radius: 40px;
            color: #FFCC00;
            font-weight: 700;
        }
        .restart-hint {
            font-size: 14px;
            opacity: 0.7;
            color: #000000;
        }
        .restart-hint kbd {
            background: #000000;
            padding: 2px 10px;
            border-radius: 6px;
            color: #FFCC00;
            font-size: 13px;
            font-weight: 700;
        }
        .best-score {
            font-size: 14px;
            opacity: 0.6;
            color: #000;
            margin-top: 2px;
        }
        .button-restart {
            margin-top: 12px;
            padding: 10px 24px;
            font-size: 18px;
            font-weight: 600;
            background: #000000;
            color: #FFCC00;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            touch-action: manipulation;
            transition: 0.2s;
        }
        .button-restart:hover {
            background: #333333;
        }
        @media (max-width: 480px) {
            .game-wrapper { padding: 12px; }
            .info { font-size: 15px; }
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="info">
        <span class="score">🍎 <span id="scoreDisplay">0</span></span>
        <span class="restart-hint">
            <kbd>Space</kbd> <span id="restart_button_lang">рестарт</span> &nbsp;·&nbsp; <kbd>WASD</kbd> / <span id="controller_button_lang">стрелки</span>
        </span>
    </div>
    <div class="best-score" id="bestScoreDisplay">🏆 Рекорд: 0</div>
    <!-- ДОБАВЛЕНА КНОПКА -->
    <button class="button-restart" id="restartButton">▶ Начать / Рестарт</button>
</div>

<script src="/sdk.js"></script>

<script>
    let ysdk = null;
    let bestScore = 0;
    let isAdShowing = false;
    let lang = 'ru';

    // ---- Языковые настройки ----
    function applyLanguage(lang) {
        const texts = {
            'ru': {
                title: 'Змейка',
                restart: 'рестарт',
                controls: 'стрелки',
                gameOver: '💀 ИГРА ОКОНЧЕНА',
                win: '🏆 ПОБЕДА!',
                restartMsg: 'Нажми ПРОБЕЛ для рестарта',
                startMsg: 'Нажмите ПРОБЕЛ или кликните, чтобы начать',
                buttonStart: '▶ Начать',
                buttonRestart: '🔄 Рестарт'
            },
            'en': {
                title: 'Snake',
                restart: 'restart',
                controls: 'arrows',
                gameOver: '💀 GAME OVER',
                win: '🏆 YOU WIN!',
                restartMsg: 'Press SPACE to restart',
                startMsg: 'Press SPACE or click to start',
                buttonStart: '▶ Start',
                buttonRestart: '🔄 Restart'
            },
            'tr': {
                title: 'Yılan',
                restart: 'tekrar başlat',
                controls: 'oklar',
                gameOver: '💀 OYUN BİTTİ',
                win: '🏆 KAZANDIN!',
                restartMsg: 'Yeniden başlatmak için SPAÇA basın',
                startMsg: 'Başlamak için SPAÇA veya tıklayın',
                buttonStart: '▶ Başla',
                buttonRestart: '🔄 Yeniden Başlat'
            }
        };
        const t = texts[lang] || texts['en'];
        document.title = t.title;
        document.getElementById('restart_button_lang').textContent = t.restart;
        document.getElementById('controller_button_lang').textContent = t.controls;
        window.gameTexts = {
            gameOver: t.gameOver,
            win: t.win,
            restart: t.restartMsg,
            start: t.startMsg,
            buttonStart: t.buttonStart,
            buttonRestart: t.buttonRestart
        };
        // Обновим текст кнопки
        updateButtonText();
        if (typeof drawCanvas === 'function') drawCanvas();
    }

    function updateButtonText() {
        const btn = document.getElementById('restartButton');
        if (!btn) return;
        const texts = window.gameTexts || {};
        // Если игра ещё не началась, показываем "Начать", иначе "Рестарт" (но будет меняться)
        // Будем обновлять при каждом вызове
        if (typeof gameStarted !== 'undefined' && !gameStarted) {
            btn.textContent = texts.buttonStart || '▶ Начать';
        } else {
            btn.textContent = texts.buttonRestart || '🔄 Рестарт';
        }
    }

    // ---- Загрузка рекорда из localStorage (fallback) ----
    function loadBestScoreLocal() {
        try {
            const saved = localStorage.getItem('snakeBestScore');
            if (saved) return Number(saved) || 0;
        } catch (_) {}
        return 0;
    }

    function saveBestScoreLocal(score) {
        try {
            localStorage.setItem('snakeBestScore', String(score));
        } catch (_) {}
    }

    // ---- Инициализация SDK ----
    (async function() {
        try {
            ysdk = await YaGames.init();
            lang = ysdk.environment.i18n.lang;
            applyLanguage(lang);
            console.log('SDK готов, язык:', lang);

            if (ysdk.features?.LoadingAPI) {
                await ysdk.features.LoadingAPI.ready();
                console.log('Game Ready API вызван');
            }

            let loaded = false;
            try {
                const player = ysdk.getPlayer();
                if (player && typeof player.getData === 'function') {
                    const data = await player.getData(['bestScore']);
                    console.log('Загруженные данные из облака:', data);
                    if (data && data.bestScore !== undefined) {
                        bestScore = Number(data.bestScore) || 0;
                        loaded = true;
                    }
                } else {
                    console.warn('Метод getData недоступен для player');
                }
            } catch (e) {
                console.warn('Ошибка загрузки рекорда из облака:', e);
            }

            if (!loaded) {
                bestScore = loadBestScoreLocal();
                console.log('Загружен рекорд из localStorage:', bestScore);
            }

            document.getElementById('bestScoreDisplay').textContent = '🏆 Рекорд: ' + bestScore;
        } catch (err) {
            console.error('Ошибка SDK:', err);
            applyLanguage('en');
            bestScore = loadBestScoreLocal();
            document.getElementById('bestScoreDisplay').textContent = '🏆 Рекорд: ' + bestScore;
        }
    })();

    // ---- Сохранение рекорда (облако + localStorage) ----
    async function saveBestScore(score) {
        saveBestScoreLocal(score);
        bestScore = score;
        document.getElementById('bestScoreDisplay').textContent = '🏆 Рекорд: ' + bestScore;

        if (!ysdk) {
            console.warn('SDK не инициализирован, рекорд сохранён только локально');
            return;
        }

        try {
            const player = ysdk.getPlayer();
            if (player && typeof player.setData === 'function') {
                await player.setData({ bestScore: score });
                console.log('Рекорд сохранён в облако:', score);
            } else {
                console.warn('Метод setData недоступен, рекорд только локально');
            }
        } catch (e) {
            console.error('Ошибка сохранения рекорда в облако:', e);
        }
    }
</script>

<script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreDisplay');
        const restartBtn = document.getElementById('restartButton');

        const GRID_SIZE = 20;
        const CELL_SIZE = canvas.width / GRID_SIZE;

        let snake = [];
        let food = { x: 8, y: 10 };
        let direction = 'RIGHT';
        let nextDirection = 'RIGHT';
        let score = 0;
        let gameOver = false;
        let winFlag = false;
        let gameInterval = null;
        const MOVE_INTERVAL_MS = 140;

        let gameStarted = false;

        // ---- Функция для обновления текста кнопки ----
        function updateButtonLabel() {
            const texts = window.gameTexts || {};
            if (!gameStarted) {
                restartBtn.textContent = texts.buttonStart || '▶ Начать';
            } else {
                restartBtn.textContent = texts.buttonRestart || '🔄 Рестарт';
            }
        }

        // ---- Инициализация игры (полный сброс) ----
        function initGame() {
            console.log('initGame вызван');
            if (gameInterval) {
                clearInterval(gameInterval);
                gameInterval = null;
            }

            snake = [
                { x: 9, y: 10 },
                { x: 8, y: 10 },
                { x: 7, y: 10 }
            ];
            direction = 'RIGHT';
            nextDirection = 'RIGHT';
            score = 0;
            gameOver = false;
            winFlag = false;
            gameStarted = true;
            updateScore();
            spawnFood();
            gameInterval = setInterval(gameTick, MOVE_INTERVAL_MS);
            window.gameInterval = gameInterval;
            updateButtonLabel();
            drawCanvas();
        }

        // ---- Функция перезапуска (вызывается извне) ----
        function restartGame() {
            console.log('restartGame вызван');
            if (gameInterval) {
                clearInterval(gameInterval);
                gameInterval = null;
            }
            initGame(); // initGame уже вызывает drawCanvas

            // Показываем рекламу асинхронно
            if (ysdk && ysdk.adv && typeof ysdk.adv.showFullscreenAdv === 'function' && !isAdShowing) {
                isAdShowing = true;
                ysdk.adv.showFullscreenAdv()
                    .catch(e => console.warn('Реклама не показана:', e))
                    .finally(() => { isAdShowing = false; });
            }
        }

        // Делаем restartGame доступной глобально для кнопки и обработчиков
        window.restartGame = restartGame;

        // ---- Остальные игровые функции ----
        function spawnFood() {
            const totalCells = GRID_SIZE * GRID_SIZE;
            if (snake.length >= totalCells) {
                winFlag = true;
                gameOver = true;
                if (gameInterval) clearInterval(gameInterval);
                return;
            }
            const occupied = new Set(snake.map(cell => `${cell.x},${cell.y}`));
            if (occupied.size === totalCells) {
                winFlag = true;
                gameOver = true;
                if (gameInterval) clearInterval(gameInterval);
                return;
            }
            let freeCells = [];
            for (let i = 0; i < GRID_SIZE; i++) {
                for (let j = 0; j < GRID_SIZE; j++) {
                    if (!occupied.has(`${i},${j}`)) freeCells.push({ x: i, y: j });
                }
            }
            if (freeCells.length === 0) {
                winFlag = true;
                gameOver = true;
                if (gameInterval) clearInterval(gameInterval);
                return;
            }
            const rand = Math.floor(Math.random() * freeCells.length);
            food = freeCells[rand];
        }

        function updateScore() {
            scoreSpan.textContent = score;
        }

        function checkCollision(head) {
            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) return true;
            for (let i = 1; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) return true;
            }
            return false;
        }

        function gameTick() {
            if (gameOver || !gameStarted) return;

            direction = nextDirection;
            const head = snake[0];
            let newHead = { ...head };
            switch (direction) {
                case 'RIGHT': newHead.x++; break;
                case 'LEFT':  newHead.x--; break;
                case 'UP':    newHead.y--; break;
                case 'DOWN':  newHead.y++; break;
                default: return;
            }

            const isEating = (newHead.x === food.x && newHead.y === food.y);
            let newSnake = [newHead, ...snake];
            if (!isEating) newSnake.pop();

            if (checkCollision(newHead)) {
                gameOver = true;
                if (gameInterval) clearInterval(gameInterval);
                if (score > bestScore) {
                    saveBestScore(score);
                }
                updateButtonLabel();
                drawCanvas();
                return;
            }

            snake = newSnake;

            if (isEating) {
                score++;
                updateScore();
                spawnFood();
                if (gameOver) {
                    if (gameInterval) clearInterval(gameInterval);
                }
            }

            drawCanvas();
        }

        // ---- Отрисовка ----
        window.drawCanvas = function() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!gameStarted) {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#000000';
                ctx.font = 'bold 26px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const startMsg = window.gameTexts?.start || 'Нажмите ПРОБЕЛ или кликните, чтобы начать';
                ctx.fillText(startMsg, canvas.width/2, canvas.height/2 - 10);
                return;
            }

            // Сетка
            ctx.strokeStyle = '#f0f0f0';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.stroke();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(canvas.width, i * CELL_SIZE);
                ctx.stroke();
            }

            // Еда
            ctx.fillStyle = '#000000';
            ctx.strokeStyle = '#FFCC00';
            ctx.lineWidth = 2.5;
            const fx = food.x * CELL_SIZE + CELL_SIZE/2;
            const fy = food.y * CELL_SIZE + CELL_SIZE/2;
            ctx.beginPath();
            ctx.arc(fx, fy, CELL_SIZE/2 - 3, 0, 2 * Math.PI);
            ctx.fill();
            ctx.stroke();

            // Змея
            snake.forEach((segment, index) => {
                const isHead = (index === 0);
                const x = segment.x * CELL_SIZE + 2;
                const y = segment.y * CELL_SIZE + 2;
                const size = CELL_SIZE - 4;

                ctx.fillStyle = '#FFCC00';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.roundRect(x, y, size, size, 4);
                ctx.fill();
                ctx.stroke();

                if (isHead) {
                    ctx.fillStyle = '#000000';
                    let ex1, ey1, ex2, ey2;
                    const r = 4;
                    switch (direction) {
                        case 'RIGHT': ex1 = x + size - 9; ey1 = y + 5; ex2 = x + size - 9; ey2 = y + size - 5; break;
                        case 'LEFT':  ex1 = x + 7; ey1 = y + 5; ex2 = x + 7; ey2 = y + size - 5; break;
                        case 'UP':    ex1 = x + 5; ey1 = y + 7; ex2 = x + size - 5; ey2 = y + 7; break;
                        case 'DOWN':  ex1 = x + 5; ey1 = y + size - 9; ex2 = x + size - 5; ey2 = y + size - 9; break;
                        default: return;
                    }
                    ctx.beginPath();
                    ctx.arc(ex1, ey1, r, 0, 2*Math.PI);
                    ctx.arc(ex2, ey2, r, 0, 2*Math.PI);
                    ctx.fill();
                }
            });

            // Game Over
            if (gameOver) {
                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#000000';
                ctx.font = 'bold 30px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                const texts = window.gameTexts || {
                    gameOver: '💀 ИГРА ОКОНЧЕНА',
                    win: '🏆 ПОБЕДА!',
                    restart: 'Нажми ПРОБЕЛ для рестарта'
                };
                let msg = winFlag ? texts.win : texts.gameOver;
                ctx.fillText(msg, canvas.width/2, canvas.height/2 - 10);
                ctx.font = '18px sans-serif';
                ctx.fillStyle = '#000000';
                ctx.fillText(texts.restart, canvas.width/2, canvas.height/2 + 40);
            }
        };

        // Полифилл
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, radii) {
                const r = typeof radii === 'number' ? radii : (radii || 0);
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                return this;
            };
        }

        // ---- Обработчик клавиш ----
        function handleKey(e) {
            if (isAdShowing) {
                e.preventDefault();
                return;
            }

            const key = e.key;
            const code = e.code;

            // Пробел – старт или рестарт
            if (key === ' ' || key === 'Spacebar' || code === 'Space') {
                e.preventDefault();
                console.log('Пробел нажат, gameStarted=', gameStarted, 'gameOver=', gameOver);
                if (!gameStarted) {
                    initGame();
                    return;
                }
                if (gameOver) {
                    restartGame();
                }
                return;
            }

            // Если игра не начата или закончена – остальные клавиши игнорируем
            if (!gameStarted || gameOver) return;

            let newDir = null;
            switch (code) {
                case 'ArrowUp':
                case 'KeyW': newDir = 'UP'; break;
                case 'ArrowDown':
                case 'KeyS': newDir = 'DOWN'; break;
                case 'ArrowLeft':
                case 'KeyA': newDir = 'LEFT'; break;
                case 'ArrowRight':
                case 'KeyD': newDir = 'RIGHT'; break;
                default: return;
            }

            const opposite = { 'UP': 'DOWN', 'DOWN': 'UP', 'LEFT': 'RIGHT', 'RIGHT': 'LEFT' };
            if (opposite[newDir] === direction) return;
            nextDirection = newDir;
        }

        // ---- Привязка событий ----
        window.addEventListener('keydown', handleKey);
        document.addEventListener('keydown', handleKey);

        // Клик по канвасу – старт или рестарт
        canvas.addEventListener('click', function(e) {
            console.log('Клик по canvas, gameStarted=', gameStarted, 'gameOver=', gameOver);
            if (!gameStarted) {
                initGame();
                return;
            }
            if (gameOver) {
                restartGame();
            }
        });
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        // Кнопка "Начать / Рестарт"
        restartBtn.addEventListener('click', function() {
            console.log('Кнопка нажата, gameStarted=', gameStarted, 'gameOver=', gameOver);
            if (!gameStarted) {
                initGame();
            } else if (gameOver) {
                restartGame();
            } else {
                // Если игра активна – ничего не делаем (или можно перезапустить?)
                // Можно предложить перезапуск по желанию, но пока оставим как есть
                // (но можно вызвать restartGame для принудительного сброса)
                // restartGame(); // раскомментируйте, если хотите перезапуск по кнопке всегда
            }
        });

        // ---- Старт: показываем стартовый экран ----
        gameStarted = false;
        updateButtonLabel();
        drawCanvas();
    })();
</script>
</body>
</html>
